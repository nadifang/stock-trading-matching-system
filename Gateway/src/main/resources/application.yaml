server:
  port: 8080
spring:
  application:
    name: gateway
  datasource:
    url: jdbc:mysql://mysql6.sqlpub.com:3311/stock_trade?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: stms_one
    password: SEnOGIyICRDI7maP
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
    database: 2
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  cloud:
    gateway:
      routes:
        # 交易转发模块
        - id: trade-transmitting
          uri: lb://trade-transmitting
          predicates:
            - Path=/api/trade/**
          filters:
            - StripPrefix=2

        # 订单查询模块
        - id: trade-query
          uri: lb://trade-query
          predicates:
            - Path=/api/query/**
          filters:
            - StripPrefix=2